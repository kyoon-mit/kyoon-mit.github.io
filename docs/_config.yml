# --- Site identity -----------------------------------------------------------
title: Kyungseop Yoon
tagline: MIT
affiliation: Massachusetts Institute of Technology
email: kyoon@mit.edu
author: Kyungseop Yoon        # the feed's author
description: >-
  Kyungseop Yoon, MIT. Machine learning for physics: LIGO binary neutron star
  time series, an agent for LIGO, and superconducting magnet control.

domain: kyungseop-yoon.com       # custom domain, without the protocol (see /CNAME)
url: https://kyungseop-yoon.com  # the base hostname and protocol for your site
baseurl: ""                      # subpath if the site is served from a subfolder, e.g. /blog

# --- Profile links -----------------------------------------------------------
# Edit these in one place; the header, home page, and footer all read from here.
github_username: kyoon-mit
links:
  cv:      /assets/cv/kyungseop-yoon-cv.pdf   # TODO: placeholder — drop the real PDF here
  scholar: https://scholar.google.com/citations?hl=en&user=tMBrA7cAAAAJ
  github:  https://github.com/kyoon-mit

# --- Collections -------------------------------------------------------------
# Research-log entries for the BNS project live in docs/_updates/.
# If a second project ever needs its own log, change this permalink to be
# per-project and filter on the `project` front-matter key.
collections:
  updates:
    output: true
    permalink: /projects/bns/updates/:name/
  magnet_updates:
    output: true
    permalink: /projects/superconducting-magnets/updates/:name/
  ligo_updates:
    output: true
    permalink: /projects/agentic-ligo/updates/:name/

defaults:
  - scope:
      path: ""
      type: updates
    values:
      layout: update
      project: bns
  - scope:
      path: ""
      type: magnet_updates
    values:
      layout: update
      project: magnets
  - scope:
      path: ""
      type: ligo_updates
    values:
      layout: update
      project: ligo
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /blog/:title/
      math: true

# --- Build settings ----------------------------------------------------------
# GitHub Pages builds future-dated posts; local builds match it.
future: true
# Dates are shown in this zone (GitHub Pages builds in UTC, which would move
# a post written in the evening to the next day).
timezone: America/New_York
plugins:
  - jekyll-feed
  - jekyll-redirect-from

# Blog posts (docs/_posts/) get the default feed at /feed.xml; the BNS research
# log has its own.
feed:
  collections:
    updates:
      path: /projects/bns/updates/feed.xml

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
