# --- Site identity -----------------------------------------------------------
title: Kyungseop Yoon
tagline: Physics and machine learning
affiliation: Massachusetts Institute of Technology
email: kyoon@mit.edu
description: >-
  Kyungseop Yoon — research at the intersection of experimental physics and
  machine learning: gravitational-wave inference with state space models,
  rare Higgs decays, and detector simulation.

domain: kyungseop-yoon.com       # custom domain, without the protocol (see /CNAME)
url: https://kyungseop-yoon.com  # the base hostname and protocol for your site
baseurl: ""                      # subpath if the site is served from a subfolder, e.g. /blog

# --- Profile links -----------------------------------------------------------
# Edit these in one place; the header, home page, and footer all read from here.
github_username: kyoon-mit
links:
  cv:      /assets/cv/kyungseop-yoon-cv.pdf   # TODO: placeholder — drop the real PDF here
  scholar: https://scholar.google.com/citations?hl=en&user=tMBrA7cAAAAJ
  github:  https://github.com/kyoon-mit

# --- Collections -------------------------------------------------------------
# Research-log entries for the BNS project live in docs/_updates/.
# If a second project ever needs its own log, change this permalink to be
# per-project and filter on the `project` front-matter key.
collections:
  updates:
    output: true
    permalink: /projects/bns/updates/:name/

defaults:
  - scope:
      path: ""
      type: updates
    values:
      layout: update
      project: bns

# --- Build settings ----------------------------------------------------------
plugins:
  - jekyll-feed
  - jekyll-redirect-from

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
