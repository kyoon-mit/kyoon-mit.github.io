<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Line plate of a decay vertex producing a photon and a meson">
  <defs>
    <pattern id="hHatch" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <line x1="0" y1="0" x2="0" y2="11" stroke="#6d5c46" stroke-width="1.6"/>
    </pattern>
  </defs>

  <!-- incoming line -->
  <line x1="70" y1="450" x2="378" y2="450" stroke="#3f3427" stroke-width="3.2"/>
  <path d="M356 439l28 11-28 11z" fill="#3f3427"/>

  <!-- vertex -->
  <circle cx="412" cy="450" r="42" fill="url(#hHatch)" stroke="#4a3d2f" stroke-width="3"/>
  <circle cx="412" cy="450" r="9" fill="#7c2d2d"/>

  <!-- photon, drawn as a fine wave -->
  <path fill="none" stroke="#3f3427" stroke-width="3.2" stroke-linecap="round"
    d="M450 430
       q 26 -30 52 -15 q 26 15 52 -15
       q 26 -30 52 -15 q 26 15 52 -15
       q 26 -30 52 -15 q 26 15 52 -15
       q 26 -30 52 -15"/>
  <circle cx="1042" cy="248" r="8" fill="none" stroke="#3f3427" stroke-width="3"/>

  <!-- meson: a narrow cone of tracks -->
  <g fill="none" stroke="#4a3d2f">
    <line x1="452" y1="468" x2="1046" y2="586" stroke-width="2.8"/>
    <line x1="452" y1="476" x2="1046" y2="666" stroke-width="2.8"/>
    <line x1="452" y1="472" x2="1030" y2="626" stroke-width="2.4" stroke-opacity=".7"/>
    <line x1="452" y1="482" x2="1010" y2="722" stroke-width="2.2" stroke-opacity=".55"/>
    <line x1="452" y1="462" x2="1018" y2="540" stroke-width="2.2" stroke-opacity=".6"/>
  </g>
  <g fill="#7c2d2d">
    <circle cx="1046" cy="586" r="6"/>
    <circle cx="1046" cy="666" r="6"/>
  </g>

  <!-- cone envelope -->
  <g fill="none" stroke="#85735c" stroke-width="2" stroke-opacity=".55" stroke-dasharray="9 11">
    <path d="M452 456 L1070 520"/>
    <path d="M452 490 L1070 742"/>
  </g>

  <!-- plate rule -->
  <line x1="70" y1="820" x2="1130" y2="820" stroke="#85735c" stroke-width="2" stroke-opacity=".6"/>
</svg>
