<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Engraved ornament standing in for artwork to come">
  <defs>
    <pattern id="pStipple" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="2" fill="#85735c" fill-opacity=".6"/>
    </pattern>
  </defs>

  <rect x="120" y="104" width="960" height="692" fill="url(#pStipple)"/>

  <!-- double rule frame -->
  <g fill="none" stroke="#4a3d2f">
    <rect x="120" y="104" width="960" height="692" stroke-width="3"/>
    <rect x="138" y="122" width="924" height="656" stroke-width="1.8" stroke-opacity=".65"/>
  </g>

  <!-- centred ornament -->
  <g fill="none" stroke="#4a3d2f">
    <circle cx="600" cy="450" r="118" stroke-width="3" stroke-opacity=".85"/>
    <circle cx="600" cy="450" r="70" stroke-width="2.6" stroke-opacity=".6"/>
    <line x1="600" y1="296" x2="600" y2="604" stroke-width="2.4" stroke-opacity=".65"/>
    <line x1="446" y1="450" x2="754" y2="450" stroke-width="2.4" stroke-opacity=".65"/>
    <line x1="491" y1="341" x2="709" y2="559" stroke-width="2" stroke-opacity=".4"/>
    <line x1="709" y1="341" x2="491" y2="559" stroke-width="2" stroke-opacity=".4"/>
  </g>
  <circle cx="600" cy="450" r="7" fill="#7c2d2d"/>
</svg>
