<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="wordmark" href="{{ '/' | relative_url }}">
      <span class="wordmark__name">{{ site.title }}</span>
      <span class="wordmark__role">{{ site.tagline }}</span>
    </a>

    <nav class="site-nav" aria-label="Main">
      <a href="{{ '/projects/bns/' | relative_url }}"
         class="site-nav__link {% if page.url contains '/projects/' %}is-current{% endif %}">Research</a>
      <a href="{{ '/about/' | relative_url }}"
         class="site-nav__link {% if page.url == '/about/' %}is-current{% endif %}">About</a>
      <a href="{{ site.links.cv | relative_url }}" class="site-nav__link">CV</a>
      <a class="site-nav__icon" href="{{ site.links.scholar }}" title="Google Scholar"
         aria-label="Google Scholar profile" rel="noopener" target="_blank">
        <svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18">
          <path d="M12 2 1 9l4 2.6V17l7 5 7-5v-5.4L23 9 12 2Zm0 2.4 7.6 4.8-7.6 5-7.6-5L12 4.4Zm-5 8.6 5 3.3 5-3.3v3.3l-5 3.6-5-3.6v-3.3Z" fill="currentColor"/>
        </svg>
      </a>
      <a class="site-nav__icon" href="{{ site.links.github }}" title="GitHub"
         aria-label="GitHub profile" rel="noopener" target="_blank">
        <svg viewBox="0 0 16 16" aria-hidden="true" width="18" height="18">
          <path fill="currentColor" d="M8 0a8 8 0 0 0-2.53 15.59c.4.07.55-.17.55-.38l-.01-1.49c-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-2.92-.89-2.92-2.86 0-.63.22-1.15.59-1.55-.04-.2-.26-.99.06-2.06 0 0 .66-.21 2.17.81a5.9 5.9 0 0 1 3.12 0c1.5-1.02 2.16-.81 2.16-.81.32 1.07.1 1.86.06 2.06.37.4.59.92.59 1.55 0 1.98-1.15 2.66-2.93 2.86.29.25.55.74.55 1.5l-.01 2.22c0 .21.14.46.55.38A8 8 0 0 0 8 0Z"/>
        </svg>
      </a>
    </nav>
  </div>
</header>
