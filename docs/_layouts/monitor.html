<!DOCTYPE html>
<html lang="en">
{% include head.html %}
<body class="theme-dark mon-body">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="mon-top">
    <a class="mon-top__back" href="{{ '/projects/agentic-ligo/' | relative_url }}">← Agentic LIGO</a>
    <h1 class="mon-top__title">{{ page.title }}</h1>
    <div class="mon-top__right">
      <span class="mon-chip" id="mon-status">no published runs</span>
      <button type="button" class="mon-btn mon-btn--ghost" id="mon-layout-reset" title="Put every panel back in its place">Reset layout</button>
      <time class="mon-clock" id="mon-clock" aria-label="Local time"></time>
    </div>
  </header>
  <main id="main">
    {{ content }}
  </main>
</body>
</html>
